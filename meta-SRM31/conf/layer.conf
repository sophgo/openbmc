# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "SRM31-layer"
BBFILE_PATTERN_SRM31-layer := "^${LAYERDIR}/"
LAYERVERSION_SRM31-layer = "1"
# LAYERSERIES_COMPAT_sophgo-layer = "honister kirkstone"
LAYERSERIES_COMPAT_SRM31-layer = "langdale mickledore"
# Provide a variable that points the base of the sophgo layer.
ASPEEDSDKBASE = '${@os.path.normpath("${LAYERDIR}/")}'
