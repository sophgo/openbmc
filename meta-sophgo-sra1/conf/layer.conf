# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sophgo-sra1-layer"
BBFILE_PATTERN_sophgo-sra1-layer := "^${LAYERDIR}/"
LAYERVERSION_sophgo-sra1-layer = "1"
# LAYERSERIES_COMPAT_sophgo-layer = "honister kirkstone"
LAYERSERIES_COMPAT_sophgo-sra1-layer = "langdale mickledore"
# Provide a variable that points the base of the sophgo layer.
ASPEEDSDKBASE = '${@os.path.normpath("${LAYERDIR}/")}'
