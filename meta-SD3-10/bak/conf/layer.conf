# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-SD3-10"
BBFILE_PATTERN_meta-SD3-10 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-SD3-10 = "6"

LAYERDEPENDS_meta-SD3-10 = "core"
LAYERSERIES_COMPAT_meta-SD3-10 = "kirkstone langdale"
